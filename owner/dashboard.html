<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Owner Dashboard - Local Shop Platform</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="dashboard"><header class="topbar"><h1>Owner Dashboard</h1><button id="logoutButton" class="logout-btn">Logout</button></header><main class="dashboard-content"><div id="message" class="message"></div><section class="shop-card"><h2 id="shopName">Loading shop...</h2><p id="ownerName"></p><p id="shopLocation"></p></section><section class="stats"><div class="stat-card"><span>Today's Orders</span><strong id="todayOrders">0</strong></div><div class="stat-card"><span>Total Orders</span><strong id="totalOrders">0</strong></div><div class="stat-card"><span>Today's Revenue</span><strong id="todayRevenue">₹0</strong></div><div class="stat-card"><span>Products</span><strong id="productCount">0</strong></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const message=document.getElementById("message");function showError(t){message.textContent=t;message.className="message error"}async function loadDashboard(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){window.location.href="./login.html";return}const uid=session.user.id;const{data:profile,error:pe}=await supabaseClient.from("profiles").select("full_name,role").eq("id",uid).single();if(pe||!profile||profile.role!=="owner"){await supabaseClient.auth.signOut();window.location.href="./login.html";return}const{data:membership,error:me}=await supabaseClient.from("shop_members").select("shop_id").eq("user_id",uid).eq("role","owner").limit(1).maybeSingle();if(me||!membership){showError("No shop is assigned to this owner.");return}const shopId=membership.shop_id;const{data:shop,error:se}=await supabaseClient.from("shops").select("name,city,state,pincode").eq("id",shopId).single();if(se){showError("Unable to load shop.");return}document.getElementById("shopName").textContent=shop.name;document.getElementById("ownerName").textContent="Owner: "+(profile.full_name||"Owner");document.getElementById("shopLocation").textContent=[shop.city,shop.state,shop.pincode].filter(Boolean).join(", ");const{data:orders,error:oe}=await supabaseClient.from("orders").select("id,total_amount,created_at").eq("shop_id",shopId);if(!oe&&orders){const today=new Date().toISOString().slice(0,10),todayOrders=orders.filter(o=>o.created_at&&o.created_at.slice(0,10)===today),todayRevenue=todayOrders.reduce((s,o)=>s+Number(o.total_amount||0),0);document.getElementById("todayOrders").textContent=todayOrders.length;document.getElementById("totalOrders").textContent=orders.length;document.getElementById("todayRevenue").textContent="₹"+todayRevenue.toFixed(0)}const{count:productCount,error:prodErr}=await supabaseClient.from("products").select("id",{count:"exact",head:true}).eq("shop_id",shopId);if(!prodErr)document.getElementById("productCount").textContent=productCount||0}document.getElementById("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();window.location.href="./login.html"});loadDashboard();</script></body></html>
