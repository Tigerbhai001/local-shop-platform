<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Owner Login - Local Shop Platform</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="auth-page"><section class="auth-card"><div class="brand"><h1>Owner Login</h1><p>Local Shop Platform</p></div><div id="message" class="message"></div><form id="loginForm"><div class="form-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="Owner email"></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Password"></div><button id="loginButton" class="primary-btn" type="submit">Login</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const form=document.getElementById("loginForm"),button=document.getElementById("loginButton"),message=document.getElementById("message");function showMessage(t,type="error"){message.textContent=t;message.className="message "+type}async function checkExistingSession(){const{data:{session}}=await supabaseClient.auth.getSession();if(session)window.location.href="./dashboard.html"}form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;button.textContent="Logging in...";message.className="message";try{const{data,error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error)throw error;const{data:profile,error:pe}=await supabaseClient.from("profiles").select("id,full_name,role").eq("id",data.user.id).single();if(pe)throw pe;if(profile.role!=="owner"){await supabaseClient.auth.signOut();throw new Error("This account is not an owner account.")}const{data:membership,error:me}=await supabaseClient.from("shop_members").select("shop_id,role").eq("user_id",data.user.id).eq("role","owner").limit(1).maybeSingle();if(me)throw me;if(!membership){await supabaseClient.auth.signOut();throw new Error("No shop is assigned to this owner account.")}showMessage("Login successful. Opening dashboard...","success");window.location.href="./dashboard.html"}catch(err){console.error(err);showMessage(err.message||"Login failed.")}finally{button.disabled=false;button.textContent="Login"}});checkExistingSession();</script></body></html>
